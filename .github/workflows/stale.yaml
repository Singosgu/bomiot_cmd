name: Release CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  build_wheels:
    name: Build (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: bomiot_cmd

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Install build dependencies
        run: |
          uv pip install --upgrade pip
          uv pip install "Nuitka==4.2.2" "tomlkit==0.13.3" "colorama>=0.4" setuptools wheel

      - name: Compile bomiot_cmd package with Nuitka
        shell: bash
        run: |
          rm -rf bomiot_cmd/build
          python -m nuitka --mode=module \
            --include-package=bomiot_cmd \
            --output-dir=bomiot_cmd/build \
            --no-pyi-file \
            --assume-yes-for-downloads \
            bomiot_cmd

      - name: Package compiled module into a wheel
        working-directory: bomiot_cmd
        shell: bash
        run: |
          rm -rf dist
          python setup.py bdist_wheel

      - name: Show wheel contents
        working-directory: bomiot_cmd
        shell: bash
        run: |
          python -c "import zipfile,glob; f=glob.glob('dist/*.whl')[0]; print('---',f); [print(n) for n in zipfile.ZipFile(f).namelist()]"

      - name: Fix wheel tags (manylinux)
        if: runner.os == 'Linux'
        working-directory: bomiot_cmd
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, zipfile, platform, shutil

          arch = platform.machine().lower()
          plat_map = {
              "x86_64": "manylinux_2_17_x86_64",
              "amd64": "manylinux_2_17_x86_64",
              "aarch64": "manylinux_2_17_aarch64",
              "arm64": "manylinux_2_17_aarch64",
          }
          if arch.startswith("armv7"):
              manylinux_tag = "manylinux_2_17_armv7l"
          else:
              manylinux_tag = plat_map.get(arch, f"manylinux_2_17_{arch}")

          for wheel in glob.glob("dist/*-linux_*.whl"):
              name, version, py, abi, plat_ext = os.path.basename(wheel).split("-", 4)
              new_name = f"{name}-{version}-{py}-{abi}-{manylinux_tag}.whl"
              new_path = os.path.join("dist", new_name)

              with zipfile.ZipFile(wheel, "r") as zin:
                  with zipfile.ZipFile(new_path, "w", zipfile.ZIP_DEFLATED) as zout:
                      for item in zin.infolist():
                          data = zin.read(item.filename)
                          if item.filename.endswith(".dist-info/WHEEL"):
                              lines = data.decode("utf-8").splitlines()
                              lines = [l for l in lines if not l.startswith("Tag:")]
                              lines.append(f"Tag: {py}-{abi}-{manylinux_tag}")
                              data = ("\n".join(lines) + "\n").encode("utf-8")
                          zout.writestr(item, data)

              os.remove(wheel)
              print(f"  {os.path.basename(wheel)} -> {new_name}")
          PY

      - name: List wheels
        working-directory: bomiot_cmd
        shell: bash
        run: ls -lh dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: bomiot_cmd/dist/*.whl

  build_wheels_arm:
    name: Build (linux-${{ matrix.arch }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: bomiot_cmd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build wheel in ${{ matrix.arch }} container
        run: |
          docker run --rm \
            --platform linux/${{ matrix.arch == 'armv7' && 'arm/v7' || 'arm64' }} \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            python:${{ matrix.python-version }}-bookworm \
            bash -c '
              set -e
              pip install --upgrade pip
              pip install patchelf "Nuitka==4.2.2" "tomlkit==0.13.3" "colorama>=0.4" setuptools wheel
              rm -rf bomiot_cmd/build
              python -m nuitka --mode=module \
                --include-package=bomiot_cmd \
                --output-dir=bomiot_cmd/build \
                --no-pyi-file \
                --assume-yes-for-downloads \
                bomiot_cmd
              cd bomiot_cmd
              rm -rf dist
              python setup.py bdist_wheel
              python - <<'"'"'PY'"'"'
              import glob, os, zipfile, platform
              arch = platform.machine().lower()
              plat_map = {"x86_64": "manylinux_2_17_x86_64", "aarch64": "manylinux_2_17_aarch64", "arm64": "manylinux_2_17_aarch64"}
              manylinux_tag = "manylinux_2_17_armv7l" if arch.startswith("armv7") else plat_map.get(arch, f"manylinux_2_17_{arch}")
              for wheel in glob.glob("dist/*-linux_*.whl"):
                  name, version, py, abi, plat_ext = os.path.basename(wheel).split("-", 4)
                  new_name = f"{name}-{version}-{py}-{abi}-{manylinux_tag}.whl"
                  new_path = os.path.join("dist", new_name)
                  with zipfile.ZipFile(wheel, "r") as zin:
                      with zipfile.ZipFile(new_path, "w", zipfile.ZIP_DEFLATED) as zout:
                          for item in zin.infolist():
                              data = zin.read(item.filename)
                              if item.filename.endswith(".dist-info/WHEEL"):
                                  lines = data.decode("utf-8").splitlines()
                                  lines = [l for l in lines if not l.startswith("Tag:")]
                                  lines.append(f"Tag: {py}-{abi}-{manylinux_tag}")
                                  data = ("\n".join(lines) + "\n").encode("utf-8")
                              zout.writestr(item, data)
                  os.remove(wheel)
                  print(f"  {os.path.basename(wheel)} -> {new_name}")
              PY
            '

      - name: List wheels
        working-directory: bomiot_cmd
        run: ls -lh dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}-${{ matrix.python-version }}
          path: bomiot_cmd/dist/*.whl

  merge:
    name: Merge Artifacts
    runs-on: ubuntu-latest
    needs: [build_wheels, build_wheels_arm]
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheels-*
          merge-multiple: true

      - name: Show merged wheels
        run: ls -lh artifacts/

      - name: Upload merged wheel bundle
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: artifacts

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, build_wheels_arm, merge]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          uv pip install --upgrade twine
          twine upload --skip-existing *.whl
