name: Release CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  build_wheels:
    name: Build (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: bomiot_cmd

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Install build dependencies
        run: |
          uv pip install --upgrade pip
          uv pip install "Nuitka==4.2.2" "tomlkit==0.15.1" "colorama>=0.4" setuptools wheel auditwheel

      - name: Compile bomiot_cmd package with Nuitka
        shell: bash
        run: |
          rm -rf bomiot_cmd/build
          python -m nuitka --mode=module \
            --include-package=bomiot_cmd \
            --output-dir=bomiot_cmd/build \
            --no-pyi-file \
            --assume-yes-for-downloads \
            bomiot_cmd

      - name: Package compiled module into a wheel
        working-directory: bomiot_cmd
        shell: bash
        run: |
          rm -rf dist
          python setup.py bdist_wheel

      - name: Show wheel contents
        working-directory: bomiot_cmd
        shell: bash
        run: |
          python -c "import zipfile,glob; f=glob.glob('dist/*.whl')[0]; print('---',f); [print(n) for n in zipfile.ZipFile(f).namelist()]"

      - name: Repair Linux wheel (manylinux)
        if: runner.os == 'Linux'
        working-directory: bomiot_cmd
        shell: bash
        continue-on-error: true
        run: |
          if auditwheel repair dist/*-linux_*.whl -w repaired/; then
            rm -f dist/*-linux_*.whl
            mv repaired/*.whl dist/
          else
            echo "auditwheel repair failed; keeping original platform wheel"
          fi

      - name: List wheels
        working-directory: bomiot_cmd
        shell: bash
        run: ls -lh dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: bomiot_cmd/dist/*.whl

  build_wheels_arm:
    name: Build (linux-${{ matrix.arch }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: bomiot_cmd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build wheel in ${{ matrix.arch }} container
        run: |
          docker run --rm \
            --platform linux/${{ matrix.arch == 'armv7' && 'arm/v7' || 'arm64' }} \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            python:${{ matrix.python-version }}-bookworm \
            bash -c '
              set -e
              pip install --upgrade pip
              pip install patchelf "Nuitka==4.2.2" "tomlkit==0.13.3" "colorama>=0.4" setuptools wheel auditwheel
              rm -rf bomiot_cmd/build
              python -m nuitka --mode=module \
                --include-package=bomiot_cmd \
                --output-dir=bomiot_cmd/build \
                --no-pyi-file \
                --assume-yes-for-downloads \
                bomiot_cmd
              cd bomiot_cmd
              rm -rf dist
              python setup.py bdist_wheel
              auditwheel repair dist/*-linux_*.whl -w repaired/
              rm -f dist/*-linux_*.whl
              mv repaired/*.whl dist/
            '

      - name: List wheels
        working-directory: bomiot_cmd
        run: ls -lh dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}-${{ matrix.python-version }}
          path: bomiot_cmd/dist/*.whl

  merge:
    name: Merge Artifacts
    runs-on: ubuntu-latest
    needs: [build_wheels, build_wheels_arm]
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheels-*
          merge-multiple: true

      - name: Show merged wheels
        run: ls -lh artifacts/

      - name: Upload merged wheel bundle
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: artifacts

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: [build_wheels, build_wheels_arm, merge]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          uv pip install --upgrade twine
          twine upload --skip-existing *.whl
